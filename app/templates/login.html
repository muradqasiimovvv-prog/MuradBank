{% extends "base.html" %}

{% block title %}Login - MuradBank{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>MuradBank</h1>
        <p class="subtitle">Digital Banking Platform</p>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary">Login</button>
        </form>

        <p class="auth-link">
            Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
        </p>

        <div class="demo-credentials">
            <h4>Demo Credentials:</h4>
            <ul>
                <li><strong>User:</strong> alice / password123</li>
                <li><strong>User:</strong> bob / password123</li>
                <li><strong>Admin:</strong> admin / admin123</li>
            </ul>
        </div>
    </div>
</div>
{% endblock %}
