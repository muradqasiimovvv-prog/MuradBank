{% extends "base.html" %}

{% block title %}Money Transfer - MuradBank{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Send Money</h1>
</div>

<div class="card max-width-500">
    <div class="card-body">
        <form method="POST" action="{{ url_for('transfer.send') }}" class="form">
            <div class="form-group">
                <label for="from_account_id">From Account</label>
                <select name="from_account_id" id="from_account_id" required>
                    <option value="">Select an account</option>
                    {% for account in accounts %}
                    <option value="{{ account.id }}">
                        {{ account.account_number }} - {{ account.balance }} {{ account.currency }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="to_account_number">Recipient Account Number</label>
                <input type="text" name="to_account_number" id="to_account_number" required>
            </div>

            <div class="form-group">
                <label for="amount">Amount (AZN)</label>
                <input type="number" name="amount" id="amount" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea name="description" id="description" rows="3"></textarea>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Send Money</button>
        </form>
    </div>
</div>
{% endblock %}
